name: DeepSeek review

# The external model reviewer while Codex is out (FBC-bk02; AGENTS.md "External model review").
# Every push to a ready pull request from this repository's own branches gets one PR comment
# headed "DeepSeek review" naming the reviewed head SHA: its findings, or that the review did
# not complete for that SHA. Not a required status check: the loop reads the comment.
#
# pull_request, never pull_request_target: a fork's PR runs no job here and never sees the
# secret. The key comes only from the DEEPSEEK_API_KEY secret (0009); GitHub masks it in logs
# and scripts/deepseek-review.py never prints, writes or posts it. DEEPSEEK_MODEL and the
# request tunables below are repository variables; an unset one takes the script's default
# (FBC-yf0j: DEEPSEEK_MAX_OUTPUT_TOKENS raises the answer allowance without a code change). The
# wall-clock bounds are not variables: a test holds their defaults inside timeout-minutes.
# The script runs from the PR head, so only branches of this repository run it. The trust
# boundary is push access, and the key is a CI-only DeepSeek key (owner decision 2026-10-05,
# FBC-omhd). -I (isolated mode) keeps a file merged beside the script, such as
# scripts/secrets.py, from shadowing a standard-library module and running with the key. Every
# action is pinned to a full commit SHA, since it runs right before the step holding the key.
# The script's own bounds (5 minutes for the git work before its first request, 45 minutes
# from that request, 1 minute to post) end every run in a comment inside timeout-minutes.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# A new head cancels the review of the old one; only the latest head gets a comment.
concurrency:
  group: deepseek-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: DeepSeek review
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Review the head with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_API_BASE: ${{ vars.DEEPSEEK_API_BASE }}
          DEEPSEEK_TOKEN_BUDGET: ${{ vars.DEEPSEEK_TOKEN_BUDGET }}
          DEEPSEEK_MAX_OUTPUT_TOKENS: ${{ vars.DEEPSEEK_MAX_OUTPUT_TOKENS }}
          DEEPSEEK_SPLIT_DEPTH: ${{ vars.DEEPSEEK_SPLIT_DEPTH }}
          DEEPSEEK_MAX_CHUNKS: ${{ vars.DEEPSEEK_MAX_CHUNKS }}
          DEEPSEEK_TIMEOUT: ${{ vars.DEEPSEEK_TIMEOUT }}
          DEEPSEEK_RETRIES: ${{ vars.DEEPSEEK_RETRIES }}
          DEEPSEEK_RETRY_DELAY: ${{ vars.DEEPSEEK_RETRY_DELAY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I scripts/deepseek-review.py
