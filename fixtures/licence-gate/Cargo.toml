# A standalone workspace of its own (fixtures/ is excluded from the main one): the licence
# gate's self-test fixture (README.md beside this file).
[package]
name = "licence-gate-app"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpl-dep = { path = "gpl-dep" }

[dev-dependencies]
gpl-dev-dep = { path = "gpl-dev-dep" }

[workspace]
resolver = "3"
# The GPL crates are path dependencies only, never members: a member is a root of the graph
# and would be checked as one, which would hide whether the gate follows dev-dependencies.
exclude = ["gpl-dep", "gpl-dev-dep"]
