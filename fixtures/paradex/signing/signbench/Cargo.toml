[package]
name = "signbench"
version = "0.1.0"
edition = "2021"

[dependencies]
starknet-crypto = "0.8.1"
starknet-core = "0.16"
k256 = { version = "0.13", features = ["ecdsa"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
alloy-sol-types = "1"
alloy-primitives = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
