[workspace]
resolver = "3"
# Members live under crates/ and crates/venues/ (AGENTS.md Layout); "crates/*" would match
# crates/venues itself.
members = ["crates/fbc-*", "crates/venues/fbc-*"]
# fixtures/ holds standalone tools (fixtures/paradex/signing/signbench, with its own manifest)
# that must never become workspace members.
exclude = ["fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/FueledByChai/fueledbychai-rs"
# Releases are git tags the consumer pins; nothing goes to crates.io (0008). Every member
# manifest also says `publish = false` itself (crates/fbc-core/tests/manifests.rs).
publish = false

[workspace.dependencies]
arrayvec = { version = "0.7", default-features = false }
compact_str = { version = "0.10", default-features = false }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
trybuild = "1"
# The Paradex signer (FBC-6): exact pins, since a silent change here changes signatures. The
# owner reviews any move (0009). starknet-core is a test oracle only (TypedData message hash).
starknet-crypto = { version = "=0.8.1", default-features = false, features = ["std"] }
starknet-core = "=0.16.0"
sha3 = { version = "=0.10.8", default-features = false }
serde_json = "1"
# The runtime's network stack (FBC-2ds, decision 0019): exact pins, so a dependency moves only
# by a ticket that says why. tokio runs current_thread (design §5.1); tokio-tungstenite and
# hyper speak WebSocket and HTTP/1.1 over the one connector in fbc-runtime, which does the
# SOCKS5 CONNECT itself. Default features are off; each crate turns on what it uses.
tokio = { version = "=1.53.2", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
# Test-only: the Stream and Sink traits a test drives a WebSocket with.
futures-util = { version = "=0.3.34", default-features = false }
# TLS for wss:// and https:// over the same connector (FBC-27a, decision 0020): rustls with the
# ring crypto provider (not aws-lc-rs), webpki-roots as the default trust anchors. rcgen is
# test-only: it generates the test CA and server certificates in memory.
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = { version = "=1.0.9", default-features = false }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
# The journal's keyed hashes (FBC-apz, decision 0024): HMAC-SHA-256, pinned exactly so a
# silent change cannot change what a recorded span hashes to. Both are already in the lockfile
# through the Paradex signer's tree.
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
# The journal's closed segments are zstd-compressed (FBC-g67, decision 0026): pinned exactly,
# default features off (no legacy formats, no dictionary builder). zstd-safe and zstd-sys are
# BSD-3-Clause; zstd-sys builds the bundled C libzstd (BSD-3-Clause).
zstd = { version = "=0.13.3", default-features = false }
# Kernel receive timestamps on Linux (FBC-2y3, decision 0031): SO_TIMESTAMPNS and recvmsg with
# its control message through nix's safe wrappers, so fbc-runtime holds no unsafe code. Pinned
# exactly; only the socket and uio modules. A Linux-only dependency of fbc-runtime.
nix = { version = "=0.31.3", default-features = false, features = ["socket", "uio"] }

# Stark-curve arithmetic is unusably slow unoptimized; the signer's tests sign thousands of
# vectors. Optimizing these dependencies in test builds changes no result, only the time.
[profile.dev.package.starknet-crypto]
opt-level = 3
[profile.dev.package.starknet-curve]
opt-level = 3
[profile.dev.package.starknet-types-core]
opt-level = 3
[profile.dev.package.lambdaworks-math]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
