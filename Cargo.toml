[workspace]
resolver = "3"
# Members live under crates/ and, from the first venue crate on, crates/venues/ (AGENTS.md
# Layout). Cargo rejects a member glob that matches nothing, so the ticket that adds the first
# venue crate also adds "crates/venues/fbc-*" here; "crates/*" would match crates/venues itself.
members = ["crates/fbc-*"]
# fixtures/ holds standalone tools (fixtures/paradex/signing/signbench, with its own manifest)
# that must never become workspace members.
exclude = ["fixtures"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/FueledByChai/fueledbychai-rs"

[workspace.dependencies]
rust_decimal = { version = "1", default-features = false, features = ["std"] }
trybuild = "1"
