[package]
name = "fbc-conformance"
description = "The adapter conformance kit: so far a stub venue server on 127.0.0.1 that plays WebSocket fault scripts, replies computed from the frame read, and HTTP replies by method and path pattern, the reconnect-storm, duplicate-ack and silence-after-subscription scripts, a check of connection attempts against reconnect pacing, the conformance toy venue's order entry, its order and fill events, its answers to queries, batches, resyncs and authentication, and its factory, and the named conformance suite as a macro with caps_truthful, commands_selfcontained, signing_golden and legacy_symbols."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# It depends on fbc-runtime and fbc-core (the conformance toy venue, src/toy/), never on a venue
# crate: venue crates take it as a dev-dependency (design §6 step 12).
[dependencies]
fbc-core = { path = "../fbc-core" }
fbc-runtime = { path = "../fbc-runtime" }
# The conformance toy's instrument specs (price grids and size steps are decimals).
rust_decimal.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time", "test-util"] }
