[package]
name = "fbc-conformance"
description = "The adapter conformance kit: so far a stub venue server on 127.0.0.1 that plays WebSocket fault scripts and fixed HTTP responses, the reconnect-storm, duplicate-ack and silence-after-subscription scripts, and a check of connection attempts against reconnect pacing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# It depends on fbc-runtime (and, in its tests, fbc-core), never on a venue crate: venue crates
# take it as a dev-dependency (design §6 step 12).
[dependencies]
fbc-runtime = { path = "../fbc-runtime" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }

[dev-dependencies]
fbc-core = { path = "../fbc-core" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time", "test-util"] }
# The runtime's toy market-data venue (crates/fbc-runtime/tests/common/toy.rs) needs it.
rust_decimal.workspace = true
