[package]
name = "fbc-examples"
description = "Sample programs the owner runs by hand, never CI: md_watch prints live Paradex, Binance USD-M and Hibachi touches and top-of-book through fbc-runtime; testnet_trade places and cancels one post-only order on Paradex testnet through fbc-oms; testnet_quote runs a fixed-offset two-sided quoting loop on Paradex testnet through the fbc-oms execution planner, a plumbing test, not a strategy, and with --mainnet a short supervised session of it on Paradex mainnet; paradex_testnet_acceptance runs FBC-8xr's acceptance script on Paradex testnet and writes its evidence report; mainnet_smoke places and cancels one post-only order on Paradex mainnet, testnet_trade's round trip, once a trustworthy resync can arm the market. The library target is empty; each sample is an example target."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The samples wire concrete venues, so everything they use is a dev-dependency: examples and
# tests may use them, and the library target, which is empty, has no dependency at all. A crate
# outside crates/venues/ never has a normal dependency on a venue crate (design §3,
# scripts/check-deps.sh, which does not count dev-dependencies).
[dev-dependencies]
fbc-conformance = { path = "../fbc-conformance" }
fbc-core = { path = "../fbc-core" }
fbc-journal = { path = "../fbc-journal" }
fbc-oms = { path = "../fbc-oms" }
fbc-runtime = { path = "../fbc-runtime" }
fbc-venue-binance-usdm = { path = "../venues/fbc-venue-binance-usdm" }
fbc-venue-hibachi = { path = "../venues/fbc-venue-hibachi" }
fbc-venue-paradex = { path = "../venues/fbc-venue-paradex" }
# testnet_quote's test reads the log facade the stack reports through (decision 0079), so no
# credential reaches a log either.
log = { workspace = true, features = ["std"] }
rust_decimal.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "signal", "net", "io-util"] }

[[example]]
name = "md_watch"
path = "examples/md_watch/main.rs"

[[example]]
name = "testnet_trade"
path = "examples/testnet_trade/main.rs"

[[example]]
name = "paradex_testnet_acceptance"
path = "examples/paradex_testnet_acceptance/main.rs"

[[example]]
name = "testnet_quote"
path = "examples/testnet_quote/main.rs"

[[example]]
name = "mainnet_smoke"
path = "examples/mainnet_smoke/main.rs"
