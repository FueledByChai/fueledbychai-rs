[package]
name = "fbc-sim"
description = "Simulation mechanisms with no calibration in them: the queue-position fill model, bracketed Pessimistic, Middle and Optimistic, and SimVenue, a simulated venue behind an ExecCodec, hosted by fbc-runtime as the peer of an order-entry session's in-process stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fbc-core = { path = "../fbc-core" }
fbc-book = { path = "../fbc-book" }
# SimPeer is the venue end of the runtime's in-process order-entry stream (decision 0104); the
# runtime never depends on this crate.
fbc-runtime = { path = "../fbc-runtime" }

[dev-dependencies]
# The hosted test (tests/hosted.rs) arms each bracket's order entry through fbc-oms and runs the
# runtime's toy market-data venue, included by path, over a WebSocket of its own on 127.0.0.1.
fbc-oms = { path = "../fbc-oms" }
fbc-journal = { path = "../fbc-journal" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time", "test-util"] }
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
rust_decimal.workspace = true
trybuild.workspace = true
