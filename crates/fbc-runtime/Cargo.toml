[package]
name = "fbc-runtime"
description = "The one generic runtime: so far a connector that opens TCP directly or through a SOCKS5 proxy, with WebSocket and HTTP/1.1 over it, plain or TLS, connection epochs with a subscription reconciler, and market-data sessions that drive a venue's planned endpoints with paced reconnects, keepalives, rotation before a venue's connection lifetime, a silence alarm, HTTP effects, poll endpoints and rate-limit buckets with a safety reserve, kernel receive timestamps and tick-to-wire on Linux, and one book per instrument and book channel with each instrument's configured trading book, journaling everything that crosses the shard boundary, decoder replay of a journaled session, and an order-entry session per account with one codec across its epochs, which takes commands only as fbc-oms authorizations or control commands and reports each unanswered request Unknown at its deadline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fbc-core = { path = "../fbc-core" }
fbc-book = { path = "../fbc-book" }
fbc-journal = { path = "../fbc-journal" }
fbc-oms = { path = "../fbc-oms" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

# SO_TIMESTAMPNS and recvmsg for kernel receive timestamps (decision 0031); elsewhere there are
# none.
[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time", "test-util"] }
tokio-tungstenite.workspace = true
rust_decimal.workspace = true
rcgen.workspace = true
hmac.workspace = true
sha2.workspace = true
zstd.workspace = true
trybuild.workspace = true
