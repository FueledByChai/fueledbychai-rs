[package]
name = "fbc-runtime"
description = "The one generic runtime: so far a connector that opens TCP directly or through a SOCKS5 proxy, with WebSocket and HTTP/1.1 over it, plain or TLS, connection epochs with a subscription reconciler, and market-data sessions that drive a venue's planned endpoints with paced reconnects, HTTP effects and poll endpoints, and one book per instrument and book channel with each instrument's configured trading book, journaling everything that crosses the shard boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fbc-core = { path = "../fbc-core" }
fbc-book = { path = "../fbc-book" }
fbc-journal = { path = "../fbc-journal" }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "sync", "time", "test-util"] }
tokio-tungstenite.workspace = true
rust_decimal.workspace = true
rcgen.workspace = true
