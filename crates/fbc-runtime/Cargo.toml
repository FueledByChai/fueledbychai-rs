[package]
name = "fbc-runtime"
description = "The one generic runtime: so far a connector that opens TCP directly or through a SOCKS5 proxy, with ws:// and HTTP/1.1 over it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros"] }
tokio-tungstenite.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros"] }
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
