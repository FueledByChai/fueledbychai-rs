[package]
name = "fbc-core"
description = "The fueledbychai-rs contract: time, units, price grids, exact prices, sealed ids, fees, instrument specs and venue capabilities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
arrayvec.workspace = true
compact_str.workspace = true
rust_decimal.workspace = true
# A `Secret` holds its value in `Zeroizing<String>` (FBC-b3b, decision 0043), which needs
# zeroize's `alloc` feature; the workspace pins the version (FBC-dm9).
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
trybuild.workspace = true
