[package]
name = "fbc-venue-paradex"
description = "The Paradex venue adapter: its signer (SNIP-12 revision 0 hash and Stark-curve signature) and SBE market data (touches, trades and order books)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fbc-core = { path = "../../fbc-core" }
rust_decimal.workspace = true
starknet-crypto.workspace = true
sha3.workspace = true
zeroize.workspace = true
serde_json.workspace = true

# fbc-conformance, fbc-journal, fbc-runtime and tokio are test-only: the decoder-replay test
# (tests/replay.rs) runs the codec in fbc-runtime against the conformance kit's stub server,
# journals the session, and rebuilds fbc-book's books from the journal (design §6 step 12).
# scripts/check-deps.sh does not count dev-dependencies.
[dev-dependencies]
fbc-book = { path = "../../fbc-book" }
fbc-conformance = { path = "../../fbc-conformance" }
fbc-journal = { path = "../../fbc-journal" }
fbc-runtime = { path = "../../fbc-runtime" }
starknet-core.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
