[package]
name = "fbc-venue-qfex"
description = "QFEX public market-data adapter, the trade socket's offline HMAC signer and authentication, and its trade-socket codec with an offline order encoder; order entry, the arm's answer, the resync, cancel settlement and the probe's own account reads only under a host-guarded probe mode (pre-production or production)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fbc-core = { path = "../../fbc-core" }
# The trade socket's authentication (src/sign, src/auth; FBC-77aa): HMAC-SHA256 and the
# random nonces it signs.
getrandom.workspace = true
hmac.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true

[dev-dependencies]
fbc-book = { path = "../../fbc-book" }
# tests/conformance.rs runs fbc-conformance's caps_truthful on the pre-production probe's caps
# (FBC-3ymj, decision 0141), and tests/liveness.rs runs a probe session against its stub server
# (FBC-39ks). scripts/check-deps.sh does not count dev-dependencies.
fbc-conformance = { path = "../../fbc-conformance" }
# tests/signing.rs journals the authentication and private frames and reads them back
# (decisions 0006 and 0028), and tests/liveness.rs runs fbc-runtime's order-entry session and
# reads its journal (FBC-39ks). scripts/check-deps.sh does not count dev-dependencies.
fbc-journal = { path = "../../fbc-journal" }
# tests/probe_resync.rs hands the probe's resync to fbc-oms's registry, which seeds no position
# from an untrustworthy snapshot (FBC-jxau, decision 0132 item 5). scripts/check-deps.sh does not
# count dev-dependencies.
fbc-oms = { path = "../../fbc-oms" }
fbc-runtime = { path = "../../fbc-runtime" }
# The tests' runtime; tests/liveness.rs runs on a paused clock (test-util).
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
